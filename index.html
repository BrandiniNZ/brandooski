<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>brandooski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --accent: #4ECBA0;
      --accent-dim: rgba(78, 203, 160, 0.15);
      --accent-glow: rgba(78, 203, 160, 0.35);
      --kick-green: #53FC18;
      --tiktok-pink: #FF004F;
      --bg: #0a0a0a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(78,203,160,0.4);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.5);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Background FX ───────────────────── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-mesh::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 50% 40%, rgba(78,203,160,0.18) 0%, transparent 70%);
      animation: pulse-glow 6s ease-in-out infinite alternate;
    }

    .bg-mesh::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    @keyframes pulse-glow {
      from { opacity: 0.6; transform: translateX(-50%) scale(1); }
      to   { opacity: 1;   transform: translateX(-50%) scale(1.12); }
    }

    /* ── Noise grain overlay ─────────────── */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 128px;
    }

    /* ── Layout ──────────────────────────── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Avatar ──────────────────────────── */
    .avatar-wrap {
      position: relative;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
    }

    .avatar-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(from 180deg, var(--accent), var(--kick-green), var(--accent), var(--kick-green), var(--accent));
      animation: spin-ring 6s linear infinite;
    }

    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      overflow: hidden;
    }

    .avatar-live-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: var(--kick-green);
      border-radius: 50%;
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px var(--kick-green);
      animation: blink-dot 2s ease-in-out infinite;
    }

    @keyframes blink-dot {
      0%, 100% { box-shadow: 0 0 8px var(--kick-green); opacity: 1; }
      50%       { box-shadow: 0 0 18px var(--kick-green); opacity: 0.75; }
    }

    /* ── Name & bio ──────────────────────── */
    .profile-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: var(--text);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.18s forwards;
    }

    .profile-name span {
      color: var(--accent);
    }

    .profile-handle {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.24s forwards;
    }

    .profile-bio {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      margin-top: 12px;
      max-width: 300px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    /* ── Stat pills ──────────────────────── */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.38s forwards;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      gap: 1px;
    }

    .stat-pill .val {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .stat-pill .lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Divider ─────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 28px 0 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.44s forwards;
    }

    /* ── Links ───────────────────────────── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.2s cubic-bezier(0.16,1,0.3,1),
        box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(20px);
    }

    .link-card:active {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .link-card:hover {
        border-color: var(--border-hover);
        background: var(--surface-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--border-hover);
      }
    }

    /* Animated shimmer on card */
    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
      pointer-events: none;
    }

    @media (hover: hover) {
      .link-card:hover::before {
        transform: translateX(100%);
      }
    }

    /* Glow stripe */
    .link-card .glow-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
    }

    .link-card .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .link-card .icon-wrap svg {
      width: 22px;
      height: 22px;
      position: relative;
      z-index: 1;
    }

    .link-card .card-text {
      flex: 1;
      min-width: 0;
    }

    .link-card .card-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card .card-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 1px;
      letter-spacing: 0.02em;
    }

    .link-card .arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    @media (hover: hover) {
      .link-card:hover .arrow {
        transform: translateX(3px);
        color: var(--text);
      }
    }

    /* KICK card */
    .card-kick .glow-line { background: var(--kick-green); }
    .card-kick .icon-wrap { background: rgba(83,252,24,0.12); }
    .card-kick .icon-wrap svg { color: var(--kick-green); }

    @media (hover: hover) {
      .card-kick:hover {
        border-color: rgba(83,252,24,0.4) !important;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(83,252,24,0.3) !important;
      }
    }

    /* TikTok card */
    .card-tiktok .glow-line {
      background: linear-gradient(to bottom, var(--tiktok-pink), #00F2EA);
    }
    .card-tiktok .icon-wrap {
      background: rgba(255,0,79,0.1);
    }
    .card-tiktok .icon-wrap svg { color: var(--tiktok-pink); }

    @media (hover: hover) {
      .card-tiktok:hover {
        border-color: rgba(255,0,79,0.4) !important;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,0,79,0.3) !important;
      }
    }

    /* ── Live badge ──────────────────────── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(83,252,24,0.12);
      border: 1px solid rgba(83,252,24,0.3);
      border-radius: 999px;
      padding: 3px 10px 3px 7px;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-display);
      letter-spacing: 0.06em;
      color: var(--kick-green);
      text-transform: uppercase;
    }

    .live-badge-dot {
      width: 6px;
      height: 6px;
      background: var(--kick-green);
      border-radius: 50%;
      animation: blink-dot 1.6s ease infinite;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    /* ── Footer ──────────────────────────── */
    .footer {
      margin-top: 44px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.1s forwards;
    }

    /* ── Staggered card entrance ─────────── */
    .link-card:nth-child(1) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.52s forwards; }
    .link-card:nth-child(2) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.62s forwards; }
    .link-card:nth-child(3) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.72s forwards; }
    .link-card:nth-child(4) { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.82s forwards; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Section label ───────────────────── */
    .section-label {
      width: 100%;
      font-size: 10px;
      font-weight: 800;
      font-family: var(--font-display);
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-left: 2px;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.48s forwards;
    }

    /* ── Safe area bottom ────────────────── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .page { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="noise"></div>

  <main class="page">

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-inner">B</div>
      </div>
      <div class="avatar-live-dot"></div>
    </div>

    <!-- Profile info -->
    <h1 class="profile-name">brando<span>oski</span></h1>
    <p class="profile-handle">@brandooski</p>
    <p class="profile-bio">live content creator&nbsp;·&nbsp;kicking it daily&nbsp;·&nbsp;come vibe 🎮</p>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-pill">
        <span class="val">KICK</span>
        <span class="lbl">Streaming</span>
      </div>
      <div class="stat-pill">
        <span class="val">TikTok</span>
        <span class="lbl">Clips</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Links -->
    <p class="section-label">Find me on</p>
    <div class="links">

      <!-- KICK -->
      <a class="link-card card-kick" href="https://kick.com/brandooski" target="_blank" rel="noopener">
        <div class="glow-line"></div>
        <div class="icon-wrap">
          <!-- Kick logo -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 3h4v7.5L13.5 3H19l-7 9 7 9h-5.5L8 13.5V21H4V3z" fill="currentColor"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Kick.com</div>
          <div class="card-meta">
            <span class="card-sub">kick.com/brandooski</span>
            <span class="live-badge">
              <span class="live-badge-dot"></span>Live
            </span>
          </div>
        </div>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- TikTok -->
      <a class="link-card card-tiktok" href="https://tiktok.com/@brandooskiii" target="_blank" rel="noopener">
        <div class="glow-line"></div>
        <div class="icon-wrap">
          <!-- TikTok logo -->
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">TikTok</div>
          <div class="card-sub">@brandooskiii</div>
        </div>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

    </div>

    <p class="footer">brandooski &copy; 2026</p>

  </main>

</body>
</html>
