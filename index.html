<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>brandooski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --accent: #4ECBA0;
      --kick-green: #53FC18;
      --tiktok-pink: #FF004F;
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-2: #222222;
      --border: #2a2a2a;
      --border-accent: #363636;
      --text: #f0f0f0;
      --text-muted: #666666;
      --text-dim: #3f3f3f;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --radius: 14px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 72px;
      max-width: 440px;
      margin: 0 auto;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(18px);
      animation: up 0.55s cubic-bezier(0.16,1,0.3,1) 0.08s forwards;
    }

    .avatar-box {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      background: var(--surface);
      border: 2px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(78,203,160,0.1), 0 0 28px rgba(78,203,160,0.1);
    }

    .live-dot {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 18px;
      height: 18px;
      background: var(--kick-green);
      border-radius: 50%;
      border: 3px solid var(--bg);
      box-shadow: 0 0 10px rgba(83,252,24,0.6);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 10px rgba(83,252,24,0.6); }
      50%       { box-shadow: 0 0 22px rgba(83,252,24,0.85); }
    }

    .profile-name {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -1px;
      text-align: center;
      color: var(--text);
      line-height: 1;
      opacity: 0;
      transform: translateY(14px);
      animation: up 0.55s cubic-bezier(0.16,1,0.3,1) 0.16s forwards;
    }

    .profile-name .name-part { color: var(--text); }
    .profile-name .accent { color: var(--accent); }

    .profile-handle {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-top: 6px;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: up 0.55s cubic-bezier(0.16,1,0.3,1) 0.22s forwards;
    }

    .profile-bio {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      margin-top: 10px;
      opacity: 0;
      transform: translateY(12px);
      animation: up 0.55s cubic-bezier(0.16,1,0.3,1) 0.28s forwards;
    }

    .schedule {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 100%;
      opacity: 0;
      transform: translateY(12px);
      animation: up 0.55s cubic-bezier(0.16,1,0.3,1) 0.34s forwards;
    }

    .schedule-icon { font-size: 14px; flex-shrink: 0; }
    .schedule-body { flex: 1; }

    .schedule-label {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .days-row { display: flex; gap: 4px; }

    .day-chip {
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px;
      letter-spacing: 0.01em;
    }

    .day-chip.stream {
      color: var(--accent);
      border-color: rgba(78,203,160,0.3);
      background: rgba(78,203,160,0.07);
      box-shadow: 0 0 8px rgba(78,203,160,0.12);
    }

    .day-chip.today-marker {
      outline: 1px solid rgba(255,255,255,0.18);
      outline-offset: 1px;
    }

    .schedule-time {
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text);
      flex-shrink: 0;
      text-align: right;
      line-height: 1.3;
    }

    .schedule-time small {
      display: block;
      font-size: 9px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 24px 0 20px;
      opacity: 0;
      animation: show 0.5s ease 0.42s forwards;
    }

    .section-label {
      width: 100%;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0;
      animation: show 0.5s ease 0.46s forwards;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 14px 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(16px);
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .link-card:active { transform: scale(0.975) !important; transition: transform 0.1s ease; }

    @media (hover: hover) {
      .link-card:hover {
        background: var(--surface-2);
        border-color: var(--border-accent);
      }
    }

    .bar {
      position: absolute;
      left: 0; top: 12%; bottom: 12%;
      width: 3px;
      border-radius: 2px;
    }

    .icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-wrap svg { width: 20px; height: 20px; }

    .card-text { flex: 1; min-width: 0; }

    .card-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .card-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 1px;
      font-family: var(--font-display);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(83,252,24,0.08);
      border: 1px solid rgba(83,252,24,0.28);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      color: var(--kick-green);
      text-transform: uppercase;
      box-shadow: 0 0 8px rgba(83,252,24,0.12);
    }

    .live-dot-sm {
      width: 5px;
      height: 5px;
      background: var(--kick-green);
      border-radius: 50%;
      animation: pulse-dot 1.8s ease infinite;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border-accent);
      cursor: pointer;
      color: var(--text-muted);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .copy-btn svg { width: 14px; height: 14px; pointer-events: none; }
    .copy-btn:active { transform: scale(0.88); }

    @media (hover: hover) {
      .copy-btn:hover {
        color: var(--text);
        border-color: rgba(78,203,160,0.5);
        background: rgba(78,203,160,0.07);
      }
    }

    .arrow {
      color: var(--text-dim);
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    @media (hover: hover) {
      .link-card:hover .arrow { transform: translateX(2px); color: var(--text-muted); }
    }

    .card-kick .bar { background: var(--kick-green); box-shadow: 0 0 8px rgba(83,252,24,0.35); }
    .card-kick .icon-wrap { background: rgba(83,252,24,0.07); color: var(--kick-green); }

    .card-tiktok .bar { background: linear-gradient(to bottom, var(--tiktok-pink), #00F2EA); }
    .card-tiktok .icon-wrap { background: rgba(255,0,79,0.07); color: var(--tiktok-pink); }

    .links .link-card:nth-child(1) { animation: up 0.5s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
    .links .link-card:nth-child(2) { animation: up 0.5s cubic-bezier(0.16,1,0.3,1) 0.62s forwards; }

    .stream-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 3px;
      font-family: var(--font-body);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      display: none;
    }

    .viewer-count {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      display: none;
    }

    .viewer-count.visible { display: inline; }
    .stream-title.visible { display: block; }

    .live-dot.offline {
      background: #444;
      box-shadow: none;
      animation: none;
    }

    .live-badge.offline {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
      color: var(--text-dim);
      box-shadow: none;
    }

    .live-badge.offline .live-dot-sm {
      background: #555;
      animation: none;
    }

    .api-status {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      opacity: 0;
      transition: opacity 0.3s ease, background 0.3s ease;
    }

    .api-status.loaded { opacity: 1; background: var(--accent); }
    .api-status.error  { opacity: 1; background: #ff4444; }

    /* ── VOD card ────────────────────────── */
    .card-vod {
      opacity: 0;
      transform: translateY(16px);
      animation: up 0.5s cubic-bezier(0.16,1,0.3,1) 0.72s forwards;
    }

    .card-kick.card-vod .bar {
      background: rgba(83,252,24,0.4);
      box-shadow: none;
    }

    .vod-thumbnail {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-2);
      flex-shrink: 0;
      display: block;
    }

    .vod-duration {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text-dim);
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .vod-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(78,203,160,0.08);
      border: 1px solid rgba(78,203,160,0.2);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }

    /* ── QR ──────────────────────────────── */
    .qr-section {
      margin-top: 30px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: show 0.5s ease 0.88s forwards;
    }

    .qr-label {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-display);
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .qr-box {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      display: inline-flex;
      box-shadow: 0 0 32px rgba(78,203,160,0.1), 0 0 0 1px rgba(255,255,255,0.05);
    }

    .qr-box canvas, .qr-box img { display: block; border-radius: 4px; }

    .qr-url {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ── Toast ───────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--surface-2);
      border: 1px solid var(--border-accent);
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--accent);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
      box-shadow: 0 0 20px rgba(78,203,160,0.18);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .footer {
      margin-top: 40px;
      font-size: 10px;
      font-family: var(--font-display);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-align: center;
      opacity: 0;
      animation: show 0.5s ease 1.05s forwards;
    }

    @keyframes up   { to { opacity: 1; transform: translateY(0); } }
    @keyframes show { to { opacity: 1; } }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .page { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="noise"></div>
  <div class="toast" id="toast"></div>

  <main class="page">

    <div class="avatar-wrap">
      <div class="avatar-box">B</div>
      <div class="live-dot" id="avatar-live-dot"></div>
    </div>

    <h1 class="profile-name"><span class="name-part">bran</span><span class="accent">dooski</span></h1>
    <p class="profile-handle">@brandooski</p>
    <p class="profile-bio">IRL streamer in NZ</p>

    <div class="schedule">
      <span class="schedule-icon">📅</span>
      <div class="schedule-body">
        <div class="schedule-label">Stream Schedule</div>
        <div class="days-row">
          <span class="day-chip" data-day="1">Mon</span>
          <span class="day-chip" data-day="2">Tue</span>
          <span class="day-chip" data-day="3">Wed</span>
          <span class="day-chip" data-day="4">Thu</span>
          <span class="day-chip stream" data-day="5">Fri</span>
          <span class="day-chip stream" data-day="6">Sat</span>
          <span class="day-chip" data-day="0">Sun</span>
        </div>
      </div>
      <div class="schedule-time">11 PM<small>NZT</small></div>
    </div>

    <div class="divider"></div>

    <p class="section-label">Find me on</p>
    <div class="links">

      <!-- KICK -->
      <a class="link-card card-kick" href="https://kick.com/brandooski" target="_blank" rel="noopener">
        <div class="bar"></div>
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 3h4v7.5L13.5 3H19l-7 9 7 9h-5.5L8 13.5V21H4V3z"/>
          </svg>
        </div>
        <div class="api-status" id="kick-api-status"></div>
        <div class="card-text">
          <div class="card-title">Kick.com</div>
          <div class="card-meta">
            <span class="card-sub">brandooski</span>
            <span class="live-badge" id="kick-live-badge"><span class="live-dot-sm"></span><span id="kick-live-label">Live</span></span>
            <span class="viewer-count" id="kick-viewers"></span>
          </div>
          <div class="stream-title" id="kick-stream-title"></div>
        </div>
        <div class="card-actions">
          <button class="copy-btn" data-copy="brandooski" aria-label="Copy Kick username">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- TikTok -->
      <a class="link-card card-tiktok" href="https://tiktok.com/@brandooskiii" target="_blank" rel="noopener">
        <div class="bar"></div>
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.78 1.52V6.76a4.85 4.85 0 01-1.01-.07z"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">TikTok</div>
          <div class="card-sub">@brandooskiii</div>
        </div>
        <div class="card-actions">
          <button class="copy-btn" data-copy="@brandooskiii" aria-label="Copy TikTok username">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- Latest VOD — always visible, upgraded by API if available -->
      <a class="link-card card-kick card-vod" id="vod-card" href="https://kick.com/brandooski/videos" target="_blank" rel="noopener noreferrer">
        <div class="bar"></div>
        <div class="icon-wrap" id="vod-thumb-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 3h4v7.5L13.5 3H19l-7 9 7 9h-5.5L8 13.5V21H4V3z"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-meta" style="margin-top:0;margin-bottom:3px;">
            <span class="vod-badge">Latest VOD</span>
          </div>
          <div class="card-title" id="vod-title" style="font-size:13px;">Watch past streams</div>
          <div class="vod-duration" id="vod-duration"></div>
        </div>
        <div class="card-actions">
          <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

    </div>

    <!-- QR Code -->
    <div class="qr-section">
      <p class="qr-label">Scan to share</p>
      <div class="qr-box"><div id="qrcode"></div></div>
      <p class="qr-url">brandininz.github.io/brandooski</p>
    </div>

    <p class="footer">© 2026 brandooski</p>

  </main>

  <script>
    // ── QR Code ──────────────────────────────────────
    // FIX: was merged with fetchLatestVOD() call — missing `new QRCode(...)`
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://brandininz.github.io/brandooski',
      width: 144,
      height: 144,
      colorDark: '#111111',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    // ── Highlight today's day chip ───────────────────
    const todayIdx = new Date().getDay();
    document.querySelectorAll('.day-chip').forEach(chip => {
      if (parseInt(chip.dataset.day) === todayIdx) {
        chip.classList.add('today-marker');
      }
    });

    // ── Kick live status ─────────────────────────────
    async function fetchKickStatus() {
      const SLUG      = 'brandooski';
      const badge     = document.getElementById('kick-live-badge');
      const label     = document.getElementById('kick-live-label');
      const viewers   = document.getElementById('kick-viewers');
      const title     = document.getElementById('kick-stream-title');
      const avatarDot = document.getElementById('avatar-live-dot');
      const apiDot    = document.getElementById('kick-api-status');

      const URLS = [
        `https://corsproxy.io/?url=https://kick.com/api/v1/channels/${SLUG}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(`https://kick.com/api/v1/channels/${SLUG}`)}`
      ];

      let data = null;
      for (const url of URLS) {
        try {
          const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
          if (!res.ok) continue;
          const json = await res.json();
          data = json.contents ? JSON.parse(json.contents) : json;
          if (data) break;
        } catch (_) { continue; }
      }

      if (!data) { apiDot.classList.add('error'); return; }

      apiDot.classList.add('loaded');
      const livestream = data.livestream;
      const isLive = !!(livestream && livestream.is_live);

      if (isLive) {
        label.textContent = 'Live';
        badge.classList.remove('offline');
        const vc = livestream.viewer_count;
        if (vc != null) {
          viewers.textContent = `${vc.toLocaleString()} watching`;
          viewers.classList.add('visible');
        }
        const st = livestream.session_title;
        if (st) { title.textContent = st; title.classList.add('visible'); }
        avatarDot.classList.remove('offline');
      } else {
        badge.classList.add('offline');
        label.textContent = 'Offline';
        avatarDot.classList.add('offline');
        viewers.classList.remove('visible');
        title.classList.remove('visible');
        const recent = data.recent_livestream || livestream;
        if (recent && recent.session_title) {
          title.textContent = `Last: ${recent.session_title}`;
          title.classList.add('visible');
        }
      }
    }

    fetchKickStatus();

    // ── Latest VOD ───────────────────────────────────
    // Card is always visible with a fallback. API upgrades it in-place.
    // Tries multiple known Kick endpoint shapes via two CORS proxies.
    async function fetchLatestVOD() {
      const SLUG         = 'brandooski';
      const TITLE_MAX    = 80;
      const ALLOWED_HOST = 'kick.com';
      const ALLOWED_IMG_HOSTS = ['kick.com', 'images.kick.com', 'stream.kick.com', 'files.kick.com', 'vod.kick.com'];

      // Try multiple endpoint shapes — Kick's API is inconsistent
      const ENDPOINTS = [
        `https://kick.com/api/v2/channels/${SLUG}/videos`,
        `https://kick.com/api/v1/channels/${SLUG}/videos`,
        `https://kick.com/api/v2/channels/${SLUG}/clips`,
      ];
      const PROXIES = [
        u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
        u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
      ];

      let data = null;

      outer:
      for (const endpoint of ENDPOINTS) {
        for (const makeProxy of PROXIES) {
          try {
            const res = await fetch(makeProxy(endpoint), { signal: AbortSignal.timeout(7000) });
            if (!res.ok) continue;
            const json = await res.json();
            const raw = json.contents ? JSON.parse(json.contents) : json;
            if (!raw || typeof raw !== 'object') continue;

            // Extract first video from various response shapes
            let candidate = null;
            if (Array.isArray(raw.data) && raw.data.length > 0)        candidate = raw.data[0];
            else if (Array.isArray(raw.videos) && raw.videos.length > 0) candidate = raw.videos[0];
            else if (Array.isArray(raw) && raw.length > 0)              candidate = raw[0];
            else if (raw.id || raw.uuid)                                 candidate = raw;

            if (candidate && typeof candidate === 'object') { data = candidate; break outer; }
          } catch (_) { continue; }
        }
      }

      // No API data — card stays with fallback text, that's fine
      if (!data) return;

      // Sanitise title
      const rawTitle = data.session_title ?? data.title ?? data.stream_title ?? data.clip_title ?? '';
      if (typeof rawTitle !== 'string' || rawTitle.trim().length === 0) return;
      const safeTitle = rawTitle.trim().slice(0, TITLE_MAX);

      // UUID for URL — Kick VOD URLs are /videos/{uuid} format
      // UUID format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      const rawSlug = data.uuid ?? data.slug ?? data.id ?? '';
      const safeSlug = String(rawSlug).replace(/[^a-zA-Z0-9\-]/g, '');

      // Thumbnail
      const rawThumb = data.thumbnail?.src ?? data.thumbnail?.url ?? data.thumbnail ?? data.preview_thumbnail?.src ?? '';
      let safeThumb = null;
      if (typeof rawThumb === 'string' && rawThumb.startsWith('https://')) {
        try {
          const thumbHost = new URL(rawThumb).hostname.replace(/^www\./, '');
          if (ALLOWED_IMG_HOSTS.some(h => thumbHost === h || thumbHost.endsWith('.' + h))) {
            safeThumb = rawThumb;
          }
        } catch (_) {}
      }

      // Duration
      const rawDur = data.duration ?? data.length ?? null;
      let safeDuration = '';
      if (typeof rawDur === 'number' && rawDur > 0 && isFinite(rawDur)) {
        const seconds = rawDur > 86400 ? Math.floor(rawDur / 1000) : rawDur;
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        safeDuration = h > 0
          ? `${h}h ${String(m).padStart(2,'0')}m`
          : `${m}m ${String(s).padStart(2,'0')}s`;
      }

      // Build & validate VOD URL
      const vodHref = safeSlug
        ? `https://kick.com/${SLUG}/videos/${safeSlug}`
        : `https://kick.com/${SLUG}/videos`;
      let finalHref;
      try {
        const parsed = new URL(vodHref);
        if (parsed.hostname.replace(/^www\./, '') !== ALLOWED_HOST) return;
        finalHref = parsed.href;
      } catch (_) { return; }

      // ── Upgrade card in-place ────────────────────────
      const card      = document.getElementById('vod-card');
      const titleEl   = document.getElementById('vod-title');
      const durEl     = document.getElementById('vod-duration');
      const thumbWrap = document.getElementById('vod-thumb-wrap');

      titleEl.textContent = safeTitle;
      if (safeDuration) durEl.textContent = safeDuration;

      if (safeThumb) {
        const img = document.createElement('img');
        img.className = 'vod-thumbnail';
        img.alt = '';
        img.decoding = 'async';
        img.loading = 'lazy';
        img.src = safeThumb;
        img.onerror = () => img.remove();
        thumbWrap.innerHTML = '';
        thumbWrap.appendChild(img);
      }

      card.setAttribute('href', finalHref);
    }

    fetchLatestVOD();

    // ── Copy buttons ─────────────────────────────────
    let toastTimer;

    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const text = btn.dataset.copy;

        const doToast = () => {
          btn.querySelector('svg').innerHTML =
            '<polyline points="20 6 9 17 4 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
          btn.style.color = 'var(--accent)';
          btn.style.borderColor = 'rgba(78,203,160,0.5)';
          showToast('Copied ' + text + ' ✓');
          setTimeout(() => {
            btn.querySelector('svg').innerHTML =
              '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
            btn.style.color = '';
            btn.style.borderColor = '';
          }, 2000);
        };

        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(doToast).catch(() => fallbackCopy(text, doToast));
        } else {
          fallbackCopy(text, doToast);
        }
      });
    });

    function fallbackCopy(text, cb) {
      const el = document.createElement('textarea');
      el.value = text;
      el.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(el);
      el.select();
      try { document.execCommand('copy'); cb(); } catch(e) {}
      document.body.removeChild(el);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }
  </script>

</body>
</html>
